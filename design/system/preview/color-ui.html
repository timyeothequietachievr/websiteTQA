<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body{margin:0;padding:22px;background:var(--tqa-paper);font-family:var(--font-sans)}
  h4{margin:14px 0 6px;font:700 10px/1 var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--tqa-charcoal)}
  h4:first-child{margin-top:0}
  .row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .chip{height:40px;border-radius:5px;display:flex;align-items:end;padding:5px 7px;box-shadow:inset 0 0 0 1px rgba(30,30,30,.06);font-size:10px;font-family:var(--font-mono)}
</style></head><body>
<h4>Ember scale · accent</h4>
<div class="row">
  <div class="chip" style="background:#FCE4DD;color:#8A2A1C">tint</div>
  <div class="chip" style="background:#F4B5A6;color:#8A2A1C">200</div>
  <div class="chip" style="background:#E27A60;color:#fff">400</div>
  <div class="chip" style="background:#D54A2F;color:#fff">ember</div>
  <div class="chip" style="background:#A8371F;color:#fff">700</div>
  <div class="chip" style="background:#8A2A1C;color:#fff">deep</div>
</div>
<h4>Ink scale · secondary + text</h4>
<div class="row">
  <div class="chip" style="background:#E3E3EC;color:#1A1A3A">100</div>
  <div class="chip" style="background:#9A9AB8;color:#1A1A3A">300</div>
  <div class="chip" style="background:#5A5A82;color:#fff">500</div>
  <div class="chip" style="background:#2B2B52;color:#fff">ink</div>
  <div class="chip" style="background:#1A1A3A;color:#fff">deep</div>
  <div class="chip" style="background:#1E1E1E;color:#fff">char</div>
</div>
<h4>Paper + neutrals · surface</h4>
<div class="row">
  <div class="chip" style="background:#FFFFFF;color:#1E1E1E">white</div>
  <div class="chip" style="background:#FAF6E1;color:#1E1E1E">50</div>
  <div class="chip" style="background:#F5F0D3;color:#1E1E1E">paper</div>
  <div class="chip" style="background:#E8E1BE;color:#1E1E1E">200</div>
  <div class="chip" style="background:#8A8572;color:#fff">500</div>
  <div class="chip" style="background:#4A4638;color:#fff">700</div>
</div>
</body></html>
