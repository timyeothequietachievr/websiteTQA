<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:34px 24px 30px;background:var(--tqa-paper);font-family:var(--font-sans);text-align:center}
.eyebrow{font:700 10px/1 var(--font-sans);letter-spacing:.22em;text-transform:uppercase;color:var(--tqa-ember);margin-bottom:14px}
h1{font-family:var(--font-display);font-size:44px;font-weight:700;letter-spacing:-.02em;color:var(--tqa-charcoal);line-height:1;margin:0;max-width:820px;margin-left:auto;margin-right:auto}
.sub{font-size:15px;color:var(--tqa-ember-deep);max-width:520px;margin:16px auto 22px;font-weight:500}
.sub i{font-family:var(--font-display);font-style:italic}
.btns{display:flex;gap:10px;justify-content:center}
.btn{padding:11px 22px;border-radius:4px;font-weight:600;font-size:14px;letter-spacing:.01em}
.p{background:var(--tqa-ember);color:var(--tqa-paper)}
.s{background:transparent;color:var(--tqa-ink);border:1px solid var(--tqa-ink)}
</style></head><body>
<div class="eyebrow">Tim Yeo · New book</div>
<h1>The Quiet Achiever</h1>
<p class="sub"><i>Tiny habits to have impact at work</i> (without pretending to be an extrovert)</p>
<div class="btns"><span class="btn p">Buy the book</span><span class="btn s">▶︎ Watch intro</span></div>
</body></html>
