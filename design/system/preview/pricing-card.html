<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:18px;background:var(--tqa-paper-soft);font-family:var(--font-sans)}
.card{position:relative;padding:22px 22px 20px;background:var(--tqa-paper);border:1px solid var(--neutral-200);border-radius:8px;box-shadow:0 1px 3px rgba(30,30,30,.06);display:flex;flex-direction:column;gap:14px;max-width:300px;margin:0 auto}
.badge{position:absolute;top:0;left:22px;transform:translateY(-50%);background:var(--tqa-sunrise);color:var(--tqa-ink-deep);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:5px 12px;border-radius:9999px}
.sub{font-size:13px;font-weight:700;color:var(--tqa-charcoal);letter-spacing:.1em;text-transform:uppercase}
.price{display:flex;align-items:baseline;gap:6px}
.amt{font-family:var(--font-display);font-size:44px;font-weight:700;letter-spacing:-.02em;color:var(--tqa-charcoal);line-height:1}
.suf{font-size:13px;font-weight:600;color:var(--neutral-500)}
ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
li{display:flex;gap:8px;color:var(--neutral-700);font-size:13px;line-height:1.4}
.check{flex-shrink:0;width:18px;height:18px;color:var(--tqa-ember)}
.cta{background:var(--tqa-ember);color:var(--tqa-paper);padding:10px 20px;border-radius:4px;text-align:center;font-weight:600;font-size:14px;letter-spacing:.01em}
</style></head><body>
<div class="card">
  <span class="badge">Best value</span>
  <header style="display:flex;flex-direction:column;gap:4px">
    <div class="sub">Audiobook + eBook</div>
    <div class="price"><span class="amt">$29</span><span class="suf">USD</span></div>
  </header>
  <ul>
    <li><svg class="check" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>Instant download, DRM-free</li>
    <li><svg class="check" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>Narrated by the author</li>
    <li><svg class="check" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>Lifetime updates</li>
  </ul>
  <div class="cta">Buy now</div>
</div>
</body></html>
