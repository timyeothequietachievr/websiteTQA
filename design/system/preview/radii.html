<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>

.row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.card{background:var(--tqa-ember);height:78px;display:flex;align-items:end;justify-content:center;padding:7px;font:700 10px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--tqa-paper)}
</style></head><body>
<div class="row">
  <div class="card" style="border-radius:2px">2 · sm</div>
  <div class="card" style="border-radius:4px">4 · md · buttons</div>
  <div class="card" style="border-radius:6px">6 · lg</div>
  <div class="card" style="border-radius:8px">8 · xl · cards</div>
  <div class="card" style="border-radius:12px">12 · 2xl · hero</div>
</div>
</body></html>
