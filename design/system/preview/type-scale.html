<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:18px 24px;background:var(--tqa-paper);font-family:var(--font-sans);color:var(--tqa-charcoal)}
.row{display:flex;align-items:baseline;gap:14px;padding:5px 0;border-bottom:1px solid var(--neutral-200)}
.row:last-child{border-bottom:none}
.k{width:52px;font-family:var(--font-mono);font-size:10px;color:var(--neutral-500)}
.px{width:54px;font-family:var(--font-mono);font-size:10px;color:var(--neutral-500)}
.fam{width:68px;font-family:var(--font-mono);font-size:9px;color:var(--neutral-500);letter-spacing:.04em;text-transform:uppercase}
.s{color:var(--tqa-charcoal)}
.serif{font-family:var(--font-display);font-weight:700;letter-spacing:-.015em}
.sans{font-family:var(--font-sans);font-weight:600}
.read{font-family:var(--font-reading)}
</style></head><body>
<div class="row"><span class="k">xs</span><span class="px">12</span><span class="fam">Basier</span><span class="s sans" style="font-size:12px;text-transform:uppercase;letter-spacing:.18em;font-weight:700">Quiet Achiever</span></div>
<div class="row"><span class="k">sm</span><span class="px">14</span><span class="fam">Basier</span><span class="s sans" style="font-size:14px;font-weight:500">The quiet achiever</span></div>
<div class="row"><span class="k">base</span><span class="px">16</span><span class="fam">Basier</span><span class="s" style="font-size:16px">The quiet achiever</span></div>
<div class="row"><span class="k">lg</span><span class="px">18</span><span class="fam">Atkinson</span><span class="s read" style="font-size:18px">The quiet achiever</span></div>
<div class="row"><span class="k">xl</span><span class="px">20</span><span class="fam">Literata</span><span class="s serif" style="font-size:20px">The quiet achiever</span></div>
<div class="row"><span class="k">2xl</span><span class="px">24</span><span class="fam">Literata</span><span class="s serif" style="font-size:24px">The quiet achiever</span></div>
<div class="row"><span class="k">3xl</span><span class="px">30</span><span class="fam">Literata</span><span class="s serif" style="font-size:30px">The quiet achiever</span></div>
<div class="row"><span class="k">5xl</span><span class="px">48</span><span class="fam">Literata</span><span class="s serif" style="font-size:48px;line-height:1">Quiet achiever</span></div>
</body></html>
