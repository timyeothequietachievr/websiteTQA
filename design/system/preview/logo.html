<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:22px;background:var(--tqa-paper);font-family:var(--font-sans);display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}
.panel{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;padding:18px;border-radius:6px;min-height:150px;text-align:center}
.cream{background:var(--tqa-paper-soft);border:1px solid var(--neutral-200)}
.ember{background:var(--tqa-ember)}
.book{font-family:var(--font-display);font-weight:700;line-height:.95;letter-spacing:-.015em;color:var(--tqa-paper);font-size:40px}
.book .sml{display:block;font-size:22px;font-weight:500;font-style:italic;margin-bottom:6px}
.mono{font-family:var(--font-display);font-weight:900;color:var(--tqa-charcoal);font-size:52px;letter-spacing:-.03em;line-height:.9}
.mono span{color:var(--tqa-ember)}
.lbl{font:700 10px/1 var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--tqa-charcoal)}
.lbl.inv{color:var(--tqa-paper);opacity:.8}
</style></head><body>
<div class="panel cream">
  <div class="mono">tq<span>a</span></div>
  <div class="lbl">Monogram · charcoal + ember</div>
</div>
<div class="panel ember">
  <div class="book"><span class="sml">the</span>Quiet Achiever</div>
  <div class="lbl inv">Wordmark lockup</div>
</div>
</body></html>
