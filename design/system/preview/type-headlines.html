<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:22px 26px;background:var(--tqa-paper);font-family:var(--font-sans);color:var(--tqa-charcoal)}
.eyebrow{font-family:var(--font-sans);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--tqa-ember);margin-bottom:10px}
h1{font-family:var(--font-display);font-size:56px;font-weight:700;letter-spacing:-.02em;color:var(--tqa-charcoal);line-height:.98;margin:0 0 8px}
.sub{font-family:var(--font-display);font-style:italic;font-weight:500;color:var(--tqa-ember-deep);font-size:18px;margin-top:2px}
.foot{font-family:var(--font-mono);font-size:10px;color:var(--neutral-500);margin-top:14px;letter-spacing:.04em}
</style></head><body>
<div class="eyebrow">Cover headline · Literata 700</div>
<h1>The Quiet Achiever</h1>
<div class="sub">Tiny habits to have impact at work</div>
<div class="foot">Display: Literata · italics for editorial asides</div>
</body></html>
