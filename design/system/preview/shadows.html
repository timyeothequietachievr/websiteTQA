<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:26px 22px;background:var(--tqa-paper-soft);font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.b{background:var(--tqa-paper);height:80px;border-radius:6px;display:flex;align-items:end;padding:7px 9px;font:700 10px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--tqa-charcoal)}
.s1{box-shadow:0 1px 2px 0 rgba(30,30,30,.06)}
.s2{box-shadow:0 1px 3px 0 rgba(30,30,30,.08),0 1px 2px -1px rgba(30,30,30,.08)}
.s3{box-shadow:0 12px 24px -6px rgba(30,30,30,.12)}
.s4{box-shadow:0 20px 40px -12px rgba(30,30,30,.18),0 0 0 1px rgba(30,30,30,.06)}
</style></head><body>
<div class="row">
  <div class="b s1">sm · cards</div>
  <div class="b s2">base · default</div>
  <div class="b s3">lg · elevated</div>
  <div class="b s4">xl + hairline · hero</div>
</div>
</body></html>
