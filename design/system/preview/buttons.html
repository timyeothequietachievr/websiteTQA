<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:26px;background:var(--tqa-paper);font-family:var(--font-sans)}
.grp{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.lbl{font:700 10px/1 var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--tqa-charcoal);min-width:92px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 22px;border-radius:4px;font-size:15px;font-weight:600;border:1px solid transparent;cursor:pointer;font-family:inherit;letter-spacing:.01em}
.btn-primary{background:var(--tqa-ember);color:var(--tqa-paper);box-shadow:0 1px 2px rgba(30,30,30,.08)}
.btn-primary:hover{background:var(--tqa-ember-deep)}
.btn-ink{background:var(--tqa-ink);color:var(--tqa-paper)}
.btn-outline{border-color:var(--tqa-ink);color:var(--tqa-ink);background:transparent}
.btn-ghost{background:transparent;color:var(--tqa-ember);padding-left:4px;padding-right:4px;border-radius:0;border-bottom:2px solid var(--tqa-ember)}
.btn-lg{padding:14px 30px;font-size:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9999px;background:var(--tqa-sunrise);color:var(--tqa-ink-deep);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
</style></head><body>
<div class="grp"><span class="lbl">Primary</span><button class="btn btn-primary">Buy the book</button><button class="btn btn-primary btn-lg">Apply for coaching</button></div>
<div class="grp"><span class="lbl">Secondary</span><button class="btn btn-ink">▶︎ Watch intro</button><button class="btn btn-outline">See pricing</button></div>
<div class="grp"><span class="lbl">Tertiary</span><button class="btn btn-ghost">Read a free chapter →</button><span class="pill">New cohort · 13 May</span></div>
</body></html>
