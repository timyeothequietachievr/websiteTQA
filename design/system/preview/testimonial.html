<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:22px 24px;background:var(--tqa-paper);font-family:var(--font-sans);position:relative;overflow:hidden}
.wrap{display:flex;gap:26px;align-items:center;position:relative;z-index:1}
.av{width:110px;height:110px;border-radius:9999px;flex-shrink:0;background:radial-gradient(circle at 35% 30%, #E5A402 0%, #D54A2F 70%)}
.q{font-family:var(--font-display);font-size:20px;line-height:1.35;font-weight:500;color:var(--tqa-charcoal);max-width:440px;margin:0;font-style:italic}
.by{margin-top:14px;font-size:11px;color:var(--tqa-charcoal);font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.role{font-size:13px;color:var(--tqa-ember-deep);font-weight:600;margin-top:2px}
.mark{position:absolute;font-family:var(--font-display);font-weight:700;font-size:180px;line-height:.8;color:var(--tqa-ember);opacity:.18;top:-22px;left:140px;pointer-events:none;user-select:none}
</style></head><body>
<span class="mark">“</span>
<div class="wrap">
  <div class="av"></div>
  <div>
    <p class="q">Tim gave me incredible advice and methods I could use in real-life scenarios. He showed me how to build confidence to speak up.</p>
    <div class="by">Ezra Ju</div>
    <div class="role">Product Designer, Domain</div>
  </div>
</div>
</body></html>
