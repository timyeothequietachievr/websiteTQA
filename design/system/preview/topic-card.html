<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:18px;background:var(--tqa-paper);font-family:var(--font-sans)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tile .ph{width:100%;aspect-ratio:3/2;border-radius:6px;display:block;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(30,30,30,.06)}
.ph::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 28% 32%, rgba(255,255,255,.15), transparent 55%)}
.title{margin:10px 0 3px;font-size:14px;font-weight:700;color:var(--tqa-charcoal);line-height:1.25;letter-spacing:.005em}
.desc{font-size:12px;color:var(--neutral-700);line-height:1.45}
</style></head><body>
<div class="grid">
  <div class="tile">
    <div class="ph" style="background:#E5A402"></div>
    <div class="title">Introducing yourself</div>
    <div class="desc">What makes a good introduction across meetings, workshops and interviews.</div>
  </div>
  <div class="tile">
    <div class="ph" style="background:#D54A2F"></div>
    <div class="title">Small talk</div>
    <div class="desc">A framework for topics that feel natural — no awkward silences.</div>
  </div>
  <div class="tile">
    <div class="ph" style="background:#2B2B52"></div>
    <div class="title">Public speaking</div>
    <div class="desc">Types of scripts and how to practice so you speak with purpose.</div>
  </div>
</div>
</body></html>
